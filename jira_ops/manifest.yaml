schema_version: "1.0"

agent:
  id: jira_ops
  name: Jira Ops
  version: "1.1.1"
  description: >
    Triages Jira work, reads issue and SLA details, adds internal comments,
    logs time, performs explicit single-step transitions, and prepares or
    sends COC HUB incident-notification emails.
  tags: [jira, operations, productivity]
  instructions: >
    Help the user inspect and act on Jira work. Start with my_open for a
    personal queue or search when the user supplies a clear JQL goal. Sort
    and summarize urgency using priority and SLA, but never invent missing
    values. Every ticket list or ticket detail must come from a successful
    Jira tool call in the current task; never answer one from memory, examples,
    or general knowledge. If Jira returns an error or no verified result, say
    that plainly and do not provide issue keys or ticket details. Before any
    comment, worklog, or transition, state the exact issue
    and proposed change; these writes require approval. Use transitions to
    inspect available destinations when uncertain. Never perform a chain of
    transitions, automatically resolve multiple issues, or add a comment or
    worklog the user did not request. Internal comments are never customer
    visible. For incident email, prepare or load a stored draft before any
    send. Show the exact subject, body, recipients, CC list, and whether the
    send is test or live. Never substitute or invent draft fields. Test and
    live sends are distinct operations; a request to preview is not consent
    to send, and a request to test is not consent to send live.
  limits:
    max_steps: 10

implementation:
  entrypoint: agent:JiraOpsAgent
  dependencies:
    - requests>=2.31,<3

authorization:
  scopes:
    issue:
      type: string
      description: Jira issue key, such as OPS-123.
      normalization: uppercase

resources:
  secrets:
    - id: connection
      label: Jira Cloud Connection
      description: Jira Cloud URL, account email, API token, and optional custom field ids.
      binding: {cardinality: one, required: true}
      fields:
        - {name: base_url, label: Jira URL, type: string, storage: values, required: true}
        - {name: email, label: Jira Email, type: string, storage: values, required: true}
        - {name: api_token, label: Jira API Token, type: secret, storage: values, required: true}
        - {name: ttr_field_id, label: Time to Resolution Field ID, type: string, storage: values, required: false}
        - {name: customer_informed_field_id, label: Customer Informed Field ID, type: string, storage: values, required: false}

    - id: coc_connection
      label: COC HUB Connection
      description: API-key connection for incident lookup and customer email delivery.
      binding: {cardinality: one, required: false}
      fields:
        - {name: base_url, label: COC HUB URL, type: string, storage: values, required: true}
        - {name: key_id, label: API Key ID, type: secret, storage: values, required: true}
        - {name: key_secret, label: API Key Secret, type: secret, storage: values, required: true}

  data:
    - id: incident_draft
      label: COC Incident Email Draft
      description: A prepared notification whose exact fields are verified again before sending.
      binding: {cardinality: many, required: false}
      fields:
        - {name: issue_key, label: Jira Issue Key, type: string, storage: keys, required: true}
        - {name: subject, label: Subject, type: string, storage: keys, required: true}
        - {name: body, label: Body, type: string, storage: keys, required: true}
        - {name: to_contacts, label: Recipients, type: object, storage: keys, required: true}
        - {name: cc_contacts, label: CC, type: object, storage: keys, required: false}
        - {name: prepared_at, label: Prepared At, type: string, storage: keys, required: true}
        - {name: sent_mode, label: Sent Mode, type: select, storage: keys, required: false, options: [test, live]}
        - {name: sent_at, label: Sent At, type: string, storage: keys, required: false}

tools:
  - id: queue
    name: Jira Queue
    description: Finds and prioritizes Jira issues.
    resources:
      secrets: [connection]
    functions:
      - id: my_open
        name: My Open Work
        description: List the current user's unresolved assigned Jira issues.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {connection: use}
        authorization:
          action: queue.my_open
        inputs:
          type: object
          additionalProperties: false
          properties:
            max_results: {type: integer, minimum: 1, maximum: 50, default: 25}
        outputs: &queue_output
          type: object
          required: [issues, returned, total]
          properties:
            issues:
              type: array
              items: &issue_summary
                type: object
                required: [key, summary, status, issue_type, priority, assignee, updated, url, sla_text, sla_millis, sla_breached]
                properties:
                  key: {type: string}
                  summary: {type: string}
                  status: {type: string}
                  issue_type: {type: string}
                  priority: {type: [string, "null"]}
                  assignee: {type: [string, "null"]}
                  updated: {type: string}
                  url: {type: string}
                  sla_text: {type: string}
                  sla_millis: {type: [integer, "null"]}
                  sla_breached: {type: boolean}
            returned: {type: integer}
            total: {type: integer}

      - id: search
        name: Search Jira
        description: Run a bounded JQL search and return normalized issue summaries.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {connection: use}
        authorization:
          action: queue.search
        inputs:
          type: object
          additionalProperties: false
          required: [jql]
          properties:
            jql: {type: string, minLength: 1, maxLength: 2000}
            max_results: {type: integer, minimum: 1, maximum: 50, default: 25}
        outputs: *queue_output

  - id: issue
    name: Jira Issue
    description: Reads and performs explicit actions on one Jira issue.
    resources:
      secrets: [connection]
    functions:
      - id: get
        name: Get Issue
        description: Read one issue including description and configured operational fields.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {connection: use}
        authorization:
          action: issue.get
          scopes:
            issue: {from_input: issue_key}
        inputs: &issue_key_input
          type: object
          additionalProperties: false
          required: [issue_key]
          properties:
            issue_key: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]*-[0-9]+$", maxLength: 64}
        outputs:
          type: object
          required: [issue]
          properties:
            issue:
              type: object
              required: [key, summary, status, issue_type, priority, assignee, updated, url, sla_text, sla_millis, sla_breached, created, description, customer_informed]
              properties:
                key: {type: string}
                summary: {type: string}
                status: {type: string}
                issue_type: {type: string}
                priority: {type: [string, "null"]}
                assignee: {type: [string, "null"]}
                updated: {type: string}
                url: {type: string}
                sla_text: {type: string}
                sla_millis: {type: [integer, "null"]}
                sla_breached: {type: boolean}
                created: {type: string}
                description: {type: string}
                customer_informed: {type: [string, "null"]}

      - id: transitions
        name: Available Transitions
        description: List the direct workflow transitions currently available for an issue.
        permission_level: 0
        timeout_seconds: 30
        resources:
          secrets: {connection: use}
        authorization:
          action: issue.transitions
          scopes:
            issue: {from_input: issue_key}
        inputs: *issue_key_input
        outputs:
          type: object
          required: [transitions]
          properties:
            transitions:
              type: array
              items:
                type: object
                required: [id, name, to_status]
                properties:
                  id: {type: string}
                  name: {type: string}
                  to_status: {type: string}

      - id: comment
        name: Add Internal Comment
        description: Add a private internal comment to one Jira issue.
        permission_level: 3
        timeout_seconds: 30
        resources:
          secrets: {connection: use}
        authorization:
          action: issue.comment
          scopes:
            issue: {from_input: issue_key}
        inputs:
          type: object
          additionalProperties: false
          required: [issue_key, body]
          properties:
            issue_key: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]*-[0-9]+$", maxLength: 64}
            body: {type: string, minLength: 1, maxLength: 10000}
        outputs:
          type: object
          required: [issue_key, comment_id]
          properties:
            issue_key: {type: string}
            comment_id: {type: string}

      - id: log_work
        name: Log Work
        description: Add a Jira worklog using Jira time notation such as 10m or 1h 30m.
        permission_level: 3
        timeout_seconds: 30
        resources:
          secrets: {connection: use}
        authorization:
          action: issue.log_work
          scopes:
            issue: {from_input: issue_key}
        inputs:
          type: object
          additionalProperties: false
          required: [issue_key, time_spent]
          properties:
            issue_key: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]*-[0-9]+$", maxLength: 64}
            time_spent: {type: string, pattern: "^[0-9]+[wdhm]( [0-9]+[wdhm])*$", maxLength: 40}
            comment: {type: string, maxLength: 2000}
        outputs:
          type: object
          required: [issue_key, worklog_id]
          properties:
            issue_key: {type: string}
            worklog_id: {type: string}

      - id: transition
        name: Transition Issue
        description: Perform one directly available transition to an exact target status.
        permission_level: 3
        timeout_seconds: 30
        resources:
          secrets: {connection: use}
        authorization:
          action: issue.transition
          scopes:
            issue: {from_input: issue_key}
        inputs:
          type: object
          additionalProperties: false
          required: [issue_key, target_status]
          properties:
            issue_key: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]*-[0-9]+$", maxLength: 64}
            target_status: {type: string, minLength: 1, maxLength: 120}
        outputs:
          type: object
          required: [issue_key, target_status, transitioned]
          properties:
            issue_key: {type: string}
            target_status: {type: string}
            transitioned: {type: boolean}

  - id: coc_incident
    name: COC HUB Incident Notifications
    description: Finds incidents and prepares or sends their customer-notification emails.
    resources:
      secrets: [coc_connection]
      data: [incident_draft]
    functions:
      - id: list_pending
        name: Pending Incident Notifications
        description: List COC HUB incidents whose customers are not marked informed.
        permission_level: 0
        timeout_seconds: 60
        resources:
          secrets: {coc_connection: use}
        authorization:
          action: coc_incident.list_pending
        inputs:
          type: object
          additionalProperties: false
          properties:
            jql: {type: string, maxLength: 2000}
            max_results: {type: integer, minimum: 1, maximum: 100, default: 25}
        outputs:
          type: object
          required: [incidents, returned, total]
          properties:
            incidents:
              type: array
              items:
                type: object
                required: [issue_key, summary, status, customer_informed]
                properties:
                  issue_key: {type: string}
                  summary: {type: string}
                  status: {type: string}
                  customer_informed: {type: string}
            returned: {type: integer}
            total: {type: integer}

      - id: prepare_email
        name: Prepare Incident Email
        description: Load COC incident details and recipients, generate an email, and store a verified draft without sending.
        permission_level: 0
        timeout_seconds: 90
        resources:
          secrets: {coc_connection: use}
          data: {incident_draft: create}
        authorization:
          action: coc_incident.prepare_email
          scopes:
            issue: {from_input: issue_key}
        inputs: &coc_issue_input
          type: object
          additionalProperties: false
          required: [issue_key]
          properties:
            issue_key: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]*-[0-9]+$", maxLength: 64}
        outputs: &draft_output
          type: object
          required: [draft_ref, issue_key, subject, body, to_contacts, cc_contacts, recommendations, prepared_at]
          properties:
            draft_ref:
              type: string
              x-resource: {type: data, id: incident_draft}
            issue_key: {type: string}
            subject: {type: string}
            body: {type: string}
            to_contacts: {type: array, items: {type: string}}
            cc_contacts: {type: array, items: {type: string}}
            recommendations: {type: array, items: {type: string}}
            prepared_at: {type: string}

      - id: get_draft
        name: Get Prepared Incident Email
        description: Load the newest stored COC email draft for one Jira issue.
        permission_level: 0
        timeout_seconds: 15
        resources:
          data: {incident_draft: list}
        authorization:
          action: coc_incident.get_draft
          scopes:
            issue: {from_input: issue_key}
        inputs: *coc_issue_input
        outputs:
          type: object
          required: [draft_ref, issue_key, subject, body, to_contacts, cc_contacts, prepared_at, sent_mode, sent_at]
          properties:
            draft_ref:
              type: string
              x-resource: {type: data, id: incident_draft}
            issue_key: {type: string}
            subject: {type: string}
            body: {type: string}
            to_contacts: {type: array, items: {type: string}}
            cc_contacts: {type: array, items: {type: string}}
            prepared_at: {type: string}
            sent_mode: {type: string, enum: ["", test, live]}
            sent_at: {type: string}

      - id: send_test
        name: Send Test Incident Email
        description: Send one verified draft in COC HUB test mode to the authenticated operator only.
        permission_level: 3
        timeout_seconds: 60
        resources: &send_resources
          secrets: {coc_connection: use}
          data: {incident_draft: [read, update]}
        authorization:
          action: coc_incident.send_test
          scopes:
            issue: {from_input: issue_key}
        inputs: &send_input
          type: object
          additionalProperties: false
          required: [draft_ref, issue_key, subject, body, to_contacts, cc_contacts]
          properties:
            draft_ref:
              type: string
              x-resource: {type: data, id: incident_draft}
            issue_key: {type: string, pattern: "^[A-Za-z][A-Za-z0-9_]*-[0-9]+$", maxLength: 64}
            subject: {type: string, minLength: 1, maxLength: 500}
            body: {type: string, minLength: 1, maxLength: 50000}
            to_contacts:
              type: array
              minItems: 1
              maxItems: 100
              items: {type: string, minLength: 1, maxLength: 320}
            cc_contacts:
              type: array
              maxItems: 100
              items: {type: string, minLength: 1, maxLength: 320}
        outputs: &send_output
          type: object
          required: [issue_key, mode, sent, sent_at, message]
          properties:
            issue_key: {type: string}
            mode: {type: string, enum: [test, live]}
            sent: {type: boolean}
            sent_at: {type: string}
            message: {type: string}

      - id: send_live
        name: Send Live Incident Email
        description: Send one verified draft to its real recipients and let COC HUB mark the customer informed.
        permission_level: 3
        timeout_seconds: 60
        resources: *send_resources
        authorization:
          action: coc_incident.send_live
          scopes:
            issue: {from_input: issue_key}
        inputs: *send_input
        outputs: *send_output
